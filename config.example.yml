# Optional overlay merged over config.json (same directory).
# Requires: pip install PyYAML
#
# Toggle backends (no need to spell litert_lm / lm_studio in a string):
#   enable_lm_studio: true / enable_litert_lm: false  -> LM Studio
#   both true -> set inference_preference: lm_studio | litert_lm
#
# If you omit enable_* keys entirely, legacy model.backend string is used.
#
# OpenAI cloud (small model for remote dev/test): omit enable_* and set
#   model.backend: openai_compatible
#   lm_studio.base_url: https://api.openai.com/v1
#   lm_studio.model: gpt-4o-mini
# Put the secret in repo-root .env as OPENAI_API_KEY=... (preferred), or here as api_key.
#
# Paths: prefer forward slashes (Windows-friendly paste), e.g.
#   paths.state_path: "%USERPROFILE%/Documents/DocuDog/DocuDog_state.json"
# state/report parents are created at startup; watch target_directories are not.

model:
  enable_litert_lm: false
  enable_lm_studio: true
  inference_preference: lm_studio
  use_mock: false
  # Tiny-prefill LiteRT bundles (e.g. some Gemma 3n E2B .litertlm): if you see
  # "Input token ids are too long ... >= 256", tighten these (prefill != litert_max_output_tokens):
  # litert_classify_context_cap: 320
  # litert_aux_max_user_chars: 200
  lm_studio:
    base_url: "http://127.0.0.1:1234"
    model: "<replace-with-model-id-from-lm-studio-ui>"
    timeout_seconds: 120
    api_key: ""
    temperature: 0.2

# --- OpenAI API example (uncomment; leave enable_* keys out of config.json) ---
# model:
#   backend: openai_compatible
#   use_mock: false
#   lm_studio:
#     base_url: "https://api.openai.com/v1"
